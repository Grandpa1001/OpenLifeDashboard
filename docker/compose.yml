# The app service of one OpenLifeDashboard installation (Architektura §12.1, §14.4, §15.1).
# Copied into the installation folder next to .env and run from there; paths are relative to it.
# The image is not named here: control/compose.release.yml, the LAST file of COMPOSE_FILE, pins
# the image of the installed release, so this file works for every release and needs no registry.
# Only the app runs here; Caddy (server mode) and the updater arrive with their modules and get
# their own files. Nothing in this file gives the app the Docker socket or the whole control folder.
services:
  app:
    restart: unless-stopped
    # The host user of the installation (the installer writes APP_UID/APP_GID from `id`), so the
    # bind-mounted folders are writable without chmod 777. Never root.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Orderly stop needs up to 15 s (Architektura §15.2); Docker must not kill before that.
    stop_grace_period: 20s
    # Only the values the app needs, never the whole .env. The optional ones are passed through
    # only when set: an empty value would be an error, so none is invented here.
    environment:
      - INSTALL_MODE=${INSTALL_MODE:?INSTALL_MODE is set by the installer}
      - BASE_URL=${BASE_URL:?BASE_URL is set by the installer}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is generated by the installer}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is generated by the installer}
      - UPDATER_ENABLED=${UPDATER_ENABLED:-false}
      - DB_BUSY_TIMEOUT_MS
      - BACKUP_DISK_RESERVE_MIB
      - IMPORT_MAX_MIB
      - RECORD_MAX_KIB
      - JSON_BODY_KIB
    # A missing host folder is an error, not a root-owned folder that Docker invents: an install
    # without its data must not look like a new one (create_host_path: false).
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./control/instance.json
        target: /instance/instance.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./control/maintenance
        target: /control/maintenance
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # Quoted: an unquoted "? 0 : 1" would make YAML read a mapping.
        - "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    # Docker's own log of the container, besides data/logs/app (Architektura §15.2).
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
