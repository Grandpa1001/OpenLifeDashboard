# The updater of one OpenLifeDashboard installation (Architektura §11.2.1, §12.1; D52.5), added to COMPOSE_FILE by the
# installation that has it, before control/compose.release.yml (which pins its image by digest, as it pins the app's).
# It is the only service with the Docker socket, so it is kept small: the host user of the installation, a root file
# system that is read only, no capability, no new privileges, no published port, and only the folders it needs. It is
# on the network of the project, where the app reaches it at updater:9090 (the client of the app is D54).
services:
  app:
    # The app needs the token to sign a command and the repository to know which releases to look at; the base file
    # gives the app neither, so an installation without the updater never holds them.
    environment:
      - UPDATER_TOKEN=${UPDATER_TOKEN:?UPDATER_TOKEN is generated by the installer for an installation with the updater}
      - RELEASES_REPO=${RELEASES_REPO:?RELEASES_REPO is set by the installer for an installation with the updater}
      # The base of the API of the releases, only when the installation does not use GitHub itself (a mirror).
      - RELEASES_API_URL
  updater:
    restart: unless-stopped
    # The host user, so the journal and the release file in ./control are the owner's files; the group of the Docker socket
    # (DOCKER_GID, written by the installer from the host, 0 on Docker Desktop) is added so the user can reach it.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 10s
    # Only what the updater needs: the token of the channel and the name of its own project, never the keys of the app.
    environment:
      - UPDATER_TOKEN=${UPDATER_TOKEN:?UPDATER_TOKEN is generated by the installer for an installation with the updater}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is set by the installer}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ./control
        target: /control
        bind:
          create_host_path: false
      - type: bind
        source: ./data/backup
        target: /backup
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9090/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
