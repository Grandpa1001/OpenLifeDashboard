packages:
  - apps/*
  - packages/*

catalog:
  "@axe-core/playwright": 4.14.0
  "@eslint/js": 10.0.1
  "@hono/node-server": 2.1.5
  # Password hashing (D09.1): argon2id with PHC strings; Better Auth's scrypt default normalizes NFKC.
  "@node-rs/argon2": 2.2.2
  "@playwright/test": 1.64.1
  "@tanstack/react-router": 1.170.46
  "@types/better-sqlite3": 9.6.0
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  # Auth adapter (Architektura §9.8): schema and crypto primitives only, see apps/server/src/adapters/auth.
  better-auth: 1.7.13
  better-sqlite3: 13.0.3
  dependency-cruiser: 18.7.0
  eslint: 10.13.0
  eslint-plugin-i18next: 6.1.5
  # Writer lease (Architektura §4.8): OFD locks on Linux, flock on macOS, LockFileEx on Windows.
  fs-native-extensions: 1.5.1
  hono: 4.13.13
  i18next: 26.5.10
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 17.1.8
  # typescript-eslint 8.72 supports TypeScript <6.1; upgrade both together.
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vite: 8.3.5
  vitest: 5.0.5
  yaml: 2.9.1
  zod: 4.6.7

engineStrict: true
minimumReleaseAgeExclude:
  - i18next@26.5.10
  - react-i18next@17.1.8
saveExact: true
