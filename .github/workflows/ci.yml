name: CI

# Two tiers (DEV §8). Every push and pull request runs the fast tier: the checks of the code that
# changes from step to step (lint, types, architecture, unit and integration on real SQLite, the
# browser tests of the built app). The full tier adds what is slow and rarely affected — Docker,
# Compose, the images on both architectures, the G0 and handover gates — and runs
#   - every night,
#   - by hand (workflow_dispatch),
#   - when a commit message contains [full] (before a gate, before a release),
#   - when the commit touches what the slow checks are about (docker/, the bootstrap, the
#     migrations and the connection, the workflow, the verification map, the lockfile).
# The gates read the reports of the full tier only; a gate is never decided on a partial set.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces the older run; a push to main is never cancelled, so
  # every commit gets its own result.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: which tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the full tier runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          full=false
          reason="nothing slow was touched"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            full=true
            reason="$EVENT"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[full\]'; then
            full=true
            reason="[full] in the commit message"
          else
            base="$BASE_SHA"
            if [ "$EVENT" = push ]; then base="$BEFORE"; fi
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              full=true
              reason="no base commit to compare with"
            else
              changed=$(git diff --name-only "$base" "$GITHUB_SHA")
              pattern='^(docker/|install/|tests/system/|\.github/|scripts/|tooling/verification-tasks\.ts|apps/server/src/bootstrap/|apps/server/src/adapters/(filesystem|logging)/|packages/sqlite/src/(migrations|connection|snapshots)/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.node-version)'
              if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
                full=true
                reason="a file of the slow checks changed"
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full tier: $full ($reason)"

  fast-core:
    name: fast tier (code, SQLite, HTTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Verify D01
        run: pnpm verify:task -- D01
      # Each task's report is evidence of its own: a failing step must not hide the later ones.
      - name: Verify D09 (D09.1–D09.4, auth adapter, owner, sign-in, reset and cookies)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D09
      - name: Verify D10 (D10.1–D10.3, second-factor mechanism, access policy, atomic adapters)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D10
      - name: Verify D11 (D11.1–D11.4, second factor, lockouts, first setup)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D11
      - name: Verify D13.1 (route inventory and request authority on raw HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D13.1
      - name: Verify D13.2 (request authority at the commit, atomic audit failure)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D13.2
      - name: Verify D14.1 (rules of the registry catalog)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14.1
      - name: Verify D14.2 (catalog and tables of registries on real SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14.2
      - name: Verify D14.3 (creating and listing registries over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14.3
      - name: Verify D15.1 (rules of one record)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15.1
      - name: Verify D15.2 (records and idempotency entries on real SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15.2
      - name: Verify D15.3 (adding and listing records over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15.3
      - name: Verify D17.1 (manifest of a widget type and the snapshot of a screen)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.1
      - name: Verify D17.2 (rules of the design of a screen)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.2
      - name: Verify D17.3 (the screen, its widgets and bindings on real SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.3
      - name: Verify D17.4 (the screen over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.4
      - name: Verify D19.1 (install.sh preflight and the installation folder)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.1
      - name: Verify D19.2 (install.sh stages, owner account and resuming)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.2
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-core
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  fast-browser:
    name: fast tier (the built app in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Verify D12 (D12.1–D12.3, sign-in, enrollment and first setup in a real browser)
        run: pnpm verify:task -- D12
      - name: Verify D16.1 (the list of registries in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.1
      - name: Verify D16.2 (the form of a new registry in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.2
      - name: Verify D16.3 (the records of a registry in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.3
      - name: Verify D18.1 (the private screen in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.1
      - name: Verify D18.2 (the Designer in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.2
      - name: Verify D18.3 (registry, Designer, three layouts and a restart)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.3
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-browser
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  full:
    name: verify:task (full tier)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Verify D01
        run: pnpm verify:task -- D01
      # Each task's report is evidence of its own: a failing step must not hide the later ones.
      - name: Verify D02.1
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D02.1
      - name: Verify D03 (D03.1–D03.4, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D03
      - name: Verify D04 (D04.1–D04.3, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D04
      - name: Verify D05 (D05.1–D05.3, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D05
      - name: Verify D06 (D06.1–D06.3, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D06
      - name: Verify D07 (D07.1–D07.3, Compose local mode, persistence and isolation, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D07
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: ${{ !cancelled() && steps.browser.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: ${{ !cancelled() && steps.browser.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium
      - name: Verify D08 (D08.1–D08.3, CI checks, theme and texts, the G0 image in a browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D08
      - name: Verify D09 (D09.1–D09.4, auth adapter, owner, sign-in, reset and cookies)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D09
      - name: Verify D10 (D10.1–D10.3, second-factor mechanism, access policy, atomic adapters)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D10
      - name: Verify D11 (D11.1–D11.4, second factor, lockouts, first setup)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D11
      - name: Verify D12 (D12.1–D12.3, sign-in, enrollment and first setup in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D12
      - name: Verify D16.1 (the list of registries in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.1
      - name: Verify D16.2 (the form of a new registry in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.2
      - name: Verify D16.3 (the records of a registry in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.3
      - name: Verify D16 (the parent, D16.1–D16.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16
      - name: Verify D13.1 (route inventory and request authority on raw HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D13.1
      - name: Verify D13.2 (request authority at the commit, atomic audit failure)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D13.2
      - name: Verify D13.3 (handover of the auth and setup work, joins the reports above)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D13.3
      - name: Verify D13 (the parent, D13.1–D13.3 together, closes the auth and setup work)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D13
      - name: Verify D14.1 (rules of the registry catalog)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14.1
      - name: Verify D14.2 (catalog and tables of registries on real SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14.2
      - name: Verify D14.3 (creating and listing registries over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14.3
      - name: Verify D14 (the parent, D14.1–D14.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D14
      - name: Verify D15.1 (rules of one record)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15.1
      - name: Verify D15.2 (records and idempotency entries on real SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15.2
      - name: Verify D15.3 (adding and listing records over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15.3
      - name: Verify D17.1 (manifest of a widget type and the snapshot of a screen)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.1
      - name: Verify D17.2 (rules of the design of a screen)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.2
      - name: Verify D17.3 (the screen, its widgets and bindings on real SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.3
      - name: Verify D17.4 (the screen over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17.4
      - name: Verify D17 (the parent, D17.1–D17.4 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D17
      - name: Verify D18.1 (the private screen in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.1
      - name: Verify D18.2 (the Designer in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.2
      - name: Verify D18.3 (registry, Designer, three layouts and a restart)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.3
      - name: Verify D18 (the parent, D18.1–D18.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18
      - name: Verify D19.1 (install.sh preflight and the installation folder)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.1
      - name: Verify D19.2 (install.sh stages, owner account and resuming)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.2
      - name: Verify D19.3 (install.sh with the real Docker, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.3
      - name: Verify D19 (the parent, D19.1–D19.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19
      - name: Verify D15 (the parent, D15.1–D15.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D15
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  image:
    # D02.2/D02.3 must run natively on each architecture; emulation is not accepted as evidence.
    name: verify:task D02.2-D02.3 (linux/${{ matrix.arch }})
    needs: full
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      OPENLIFE_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Verify D02.2
        run: pnpm verify:task -- D02.2
      - name: Verify D02.3
        run: pnpm verify:task -- D02.3
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-image-${{ matrix.arch }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  g0:
    # Gate G0 (DEV §8.4): joins the reports of the full job and of both image architectures for
    # this commit; it runs even when one of them failed, so the gate reports what is missing. It
    # never runs on a partial set: when the full tier is skipped, so is the gate.
    name: verify:task G0 (KM0 reports + amd64/arm64)
    needs: [full, image]
    if: ${{ !cancelled() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Download the KM0 reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-reports
          path: .artifacts/ci-reports
      - name: Download architecture reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-image-*
          path: .artifacts/arch-reports
      - name: Verify G0 (includes D02)
        run: pnpm verify:task -- G0
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-g0
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
