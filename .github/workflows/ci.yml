      - name: Verify D28.2 (carrying out a change of a column over HTTP under the gate, S8)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D28.2
      - name: Verify D29.1 (the copy pre_type_change as the first phase of a change of type)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D29.1
      - name: Verify D29.2 (carrying out a change of type over HTTP after its copy, S9)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D29.2
      - name: Verify D30.1 (deleting a registry over HTTP after its copy pre_delete, S10)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D30.1
      - name: Verify D30.2 (restoring a deleted registry from its copy with restore-registry)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D30.2
      - name: Verify D32.1 (the system preview over HTTP, read only, from a fixed list of tables)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D32.1
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-structure
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  fast-browser:
    # The built app in a browser from the start screen to the vertical path (D12-D20.1), the reports of
    # G1. The records in a browser (D22.2-D25.3) have a job of their own since run 41821872633 (28 of 30 minutes).
    name: fast tier (the built app in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
