      - name: Verify D27.2 (the rebuild as an operation of the maintenance gate, and its reconciliation)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D27.2
      - name: Verify D28.1 (adding, renaming, removing a column and making it required, in core and SQLite)
        if: ${{ !cancelled() }}
