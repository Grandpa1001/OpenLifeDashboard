            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Verify D12 (D12.1–D12.3, sign-in, enrollment and first setup in a real browser)
        run: pnpm verify:task -- D12
      - name: Verify D16.1 (the list of registries in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.1
      - name: Verify D16.2 (the form of a new registry in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.2
      - name: Verify D16.3 (the records of a registry in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D16.3
      - name: Verify D18.1 (the private screen in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.1
      - name: Verify D18.2 (the Designer in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.2
      - name: Verify D18.3 (registry, Designer, three layouts and a restart)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.3
      - name: Verify D20.1 (the vertical path of the owner in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D20.1
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-browser
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  fast-records-browser:
    # The records, their types, edits, search, dictionaries and ConfigTable in a browser (D22.2-D25.3),
    # split from the browser job at 28 of its 30 minutes (run 41821872633); G2 reads its reports.
    name: fast tier (the records in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
