name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:task
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify D01
        run: pnpm verify:task -- D01
      - name: Verify D02.1
        run: pnpm verify:task -- D02.1
      - name: Verify D03.1
        run: pnpm verify:task -- D03.1
      - name: Verify D03.2
        run: pnpm verify:task -- D03.2
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  image:
    # D02.2/D02.3 must run natively on each architecture; emulation is not accepted as evidence.
    name: verify:task D02.2-D02.3 (linux/${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      OPENLIFE_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify D02.2
        run: pnpm verify:task -- D02.2
      - name: Verify D02.3
        run: pnpm verify:task -- D02.3
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-image-${{ matrix.arch }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  d02:
    # Joins the per-architecture reports of this commit: D02 passes only with both.
    name: verify:task D02 (amd64 + arm64)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download architecture reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-image-*
          path: .artifacts/arch-reports
      - name: Verify D02
        run: pnpm verify:task -- D02
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-d02
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
