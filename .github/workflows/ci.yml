      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-structure-browser
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  fast-screens-browser:
    # The screen of the owner, Pulpity, the grid and the context bar of the Designer (D33.1-D34.3) in
    # the built app. The saving of the Designer and the widgets from D35.1 on have a job of their own.
    name: fast tier (screens and the Designer in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
