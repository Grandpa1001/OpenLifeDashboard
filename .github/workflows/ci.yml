          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Verify D22.2 (the form of a new registry as rows in a real browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D22.2
      - name: Verify D22.3 (every column type through the window of a record, F03 over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D22.3
      - name: Verify D23.3 (changing and deleting a record in the browser, the conflict of two tabs)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D23.3
      - name: Verify D23.4 (searching, sorting and paging the records in the browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D23.4
      - name: Verify D24.3 (dictionaries in the browser, S7)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D24.3
      - name: Verify D25.3 (ConfigTable in the browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D25.3
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-records-browser
          path: .artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  fast-structure-browser:
    # The screens of the structure of a registry (D31.1 on) in the built app. Its own job because the
    # browser job has 22 of its 30 minutes (run 41449153003).
    name: fast tier (structure of the registries in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
