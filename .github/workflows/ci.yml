      - name: Verify D18.3 (registry, Designer, three layouts and a restart)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18.3
      - name: Verify D18 (the parent, D18.1–D18.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D18
      - name: Verify D33 (the parent, D33.1–D33.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D33
      - name: Verify D34 (the parent, D34.1–D34.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D34
      - name: Verify D35 (the parent, D35.1–D35.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D35
      - name: Verify D36 (the parent, D36.1–D36.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D36
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-screens
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  full-stream:
    # The live stream and its events: on the server, in a tab and behind Caddy (Docker on the runner), and the events of changes in the application, in two parents.
    name: verify:task (full tier, live stream D37-D38)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: ${{ !cancelled() && steps.browser.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: ${{ !cancelled() && steps.browser.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium
      - name: Verify D37 (the parent, D37.1–D37.3 together; the phone is a manual protocol and not run here)
        run: pnpm verify:task -- D37
      - name: Verify D38 (the parent, D38.1–D38.3 together)
        run: pnpm verify:task -- D38
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-stream
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  full-install:
    # Installer: install.sh against stubbed and the real Docker.
    name: verify:task (full tier, installer D19)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Verify D19.1 (install.sh preflight and the installation folder)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.1
      - name: Verify D19.2 (install.sh stages, owner account and resuming)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.2
      - name: Verify D19.3 (install.sh with the real Docker, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19.3
      - name: Verify D19 (the parent, D19.1–D19.3 together)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D19
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-install
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  image:
    # D02.2/D02.3 must run natively on each architecture; emulation is not accepted as evidence.
    name: verify:task D02.2-D02.3 (linux/${{ matrix.arch }})
    needs: full
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      OPENLIFE_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Verify D02.2
        run: pnpm verify:task -- D02.2
      - name: Verify D02.3
        run: pnpm verify:task -- D02.3
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-image-${{ matrix.arch }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  g0:
    # Gate G0 (DEV §8.4): joins the reports of the full job and of both image architectures for
    # this commit; it runs even when one of them failed, so the gate reports what is missing. It
    # never runs on a partial set: when the full tier is skipped, so is the gate.
    name: verify:task G0 (KM0 reports + amd64/arm64)
    needs: [full, image]
    if: ${{ !cancelled() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Download the KM0 reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-reports
          path: .artifacts/ci-reports
      - name: Download architecture reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-image-*
          path: .artifacts/arch-reports
      - name: Verify G0 (includes D02)
        run: pnpm verify:task -- G0
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-g0
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  g2:
    # Gate G2 (DEV §8.4, §9.29): runs the whole of F01 on one installation in a browser, then joins the
    # reports of the tasks of KM2 from the fast tier (data, browser, structure, structure in a browser)
    # and decides every item from their logs. Like the other gates it runs only with the full tier,
    # never on a partial set.
    name: verify:task G2 (full F01, dictionary, ConfigTable and structure reports)
    needs: [changes, fast-data, fast-browser, fast-records-browser, fast-structure, fast-structure-browser]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: ${{ steps.browser.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: ${{ steps.browser.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium
      - name: Download the reports of the fast tier of KM2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-fast-{data,browser,records-browser,structure,structure-browser}
          path: .artifacts/ci-reports
      - name: Verify G2 (the path of F01, the matrix and the reports of KM2)
        run: pnpm verify:task -- G2
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-g2
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  g1:
    # Gate G1 (DEV §8.4): joins the reports of the vertical path, which come from the fast tier and
    # from the installer job of the full tier, and decides from the logs. The parent D20 runs the
    # path and the attempts to go around the gate again on this runner, then the gate. Like G0 it
    # never runs on a partial set: when the full tier is skipped, so is the gate.
    name: verify:task G1 (vertical path reports)
    needs: [fast-core, fast-browser, full-install]
    if: ${{ !cancelled() && needs.full-install.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        # The pinned Node runtime (58 MB from nodejs.org) sometimes stalls at a few KB/s for tens of
        # minutes on a runner; a stalled attempt is cut after 5 minutes and started again.
        run: |
          for attempt in 1 2 3 4; do
            timeout 300 pnpm install --frozen-lockfile && exit 0
            echo "install attempt $attempt did not finish; trying again"
          done
          exit 1
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the Playwright browser
        if: ${{ steps.browser.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the cached browser
        if: ${{ steps.browser.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium
      - name: Download the reports of the fast tier and of the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-{fast-core,fast-browser,install}
          path: .artifacts/ci-reports
      - name: Verify D20 (D20.1–D20.3 together, gate G1)
        run: pnpm verify:task -- D20
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-g1
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
