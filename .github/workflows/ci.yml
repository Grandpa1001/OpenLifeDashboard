      - name: Verify D22.1 (every column type in the web app, exact amounts)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D22.1
      - name: Verify D23.1 (changing and deleting a record on its revision over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D23.1
      - name: Verify D23.2 (searching the records over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D23.2
      - name: Verify D24.1 (the dictionaries in core and SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D24.1
      - name: Verify D24.2 (dictionaries and their labels over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D24.2
      - name: Verify D25.1 (ConfigTable in core and SQLite)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D25.1
      - name: Verify D25.2 (ConfigTable over HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D25.2
      - name: Verify D26.1 (a change of the structure before it is made, in core)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D26.1
      - name: Verify D26.2 (the preview of a change of the structure over SQLite and HTTP)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D26.2
      - name: Verify D37.1 (the live stream on the server, behind the gate, ended with the session or the server)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D37.1
      - name: Verify D38.1 (the events of committed changes, from the routes to the open streams)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D38.1
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-fast-data
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  fast-structure:
    # The changes of a registry's structure (D27.1 on): the rebuild, the operation of the gate and its
    # copies. Split from the job of the data after run 41434432642 (19 of its 30 minutes).
    name: fast tier (structure of the registries, SQLite, HTTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
