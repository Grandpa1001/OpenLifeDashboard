name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:task
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify D01
        run: pnpm verify:task -- D01
      - name: Verify D02.1
        run: pnpm verify:task -- D02.1
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
