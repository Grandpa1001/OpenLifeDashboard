name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify:task
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify D01
        run: pnpm verify:task -- D01
      # Each task's report is evidence of its own: a failing step must not hide the later ones.
      - name: Verify D02.1
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D02.1
      - name: Verify D03 (D03.1–D03.4, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D03
      - name: Verify D04 (D04.1–D04.3, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D04
      - name: Verify D05 (D05.1–D05.3, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D05
      - name: Verify D06 (D06.1–D06.3, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D06
      - name: Verify D07 (D07.1–D07.3, Compose local mode, persistence and isolation, Docker on the runner)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D07
      - name: Install the Playwright browser
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify D08 (D08.1–D08.3, CI checks, theme and texts, the G0 image in a browser)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D08
      - name: Verify D09 (D09.1–D09.4, auth adapter, owner, sign-in, reset and cookies)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D09
      - name: Verify D10 (D10.1–D10.3, second-factor mechanism, access policy, atomic adapters)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D10
      - name: Verify D11.1 (enrollment of the second factor, recovery codes)
        if: ${{ !cancelled() }}
        run: pnpm verify:task -- D11.1
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: .artifacts/
          # The report directory is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  image:
    # D02.2/D02.3 must run natively on each architecture; emulation is not accepted as evidence.
    name: verify:task D02.2-D02.3 (linux/${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      OPENLIFE_EXPECT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify D02.2
        run: pnpm verify:task -- D02.2
      - name: Verify D02.3
        run: pnpm verify:task -- D02.3
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-image-${{ matrix.arch }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  g0:
    # Gate G0 (DEV §8.4): joins the reports of the verify job and of both image architectures for
    # this commit; it runs even when one of them failed, so the gate reports what is missing.
    name: verify:task G0 (KM0 reports + amd64/arm64)
    needs: [verify, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable the pnpm version pinned in packageManager
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download the KM0 reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-reports
          path: .artifacts/ci-reports
      - name: Download architecture reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-image-*
          path: .artifacts/arch-reports
      - name: Verify G0 (includes D02)
        run: pnpm verify:task -- G0
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-g0
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
